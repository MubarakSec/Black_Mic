name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Lint (server syntax + client oxlint)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build client
        run: npm --prefix client run build

      - name: Smoke-check built bundle
        run: |
          (npm --prefix client run preview -- --port 4173 --host 127.0.0.1 & echo $! > /tmp/preview.pid)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /tmp/preview.html && break; sleep 0.5; done
          grep -q '<div id="root">' /tmp/preview.html
          kill $(cat /tmp/preview.pid) || true
